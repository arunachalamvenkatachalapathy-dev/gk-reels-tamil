name: Read-only Tamil Meta credential identity
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  identity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read Meta token identity only (no token values printed)
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
        run: |
          python - <<'PY'
          import json,os,urllib.error,urllib.parse,urllib.request
          GRAPH='https://graph.facebook.com/v26.0'
          token=os.environ.get('IG_ACCESS_TOKEN','').strip()
          def get(path,values):
              url=GRAPH+'/'+path+'?'+urllib.parse.urlencode(values)
              req=urllib.request.Request(url,headers={'Authorization':'Bearer '+token})
              try:
                  with urllib.request.urlopen(req,timeout=30) as r:return json.load(r)
              except urllib.error.HTTPError as e:
                  return {'http_error':e.code}
              except Exception:
                  return {'error':'transport'}
          out={}
          if not token:
              out['token_present']=False
          else:
              out['token_present']=True
              debug=get('debug_token',{'input_token':token}).get('data',{})
              out['debug']={k:debug.get(k) for k in ('is_valid','type','app_id','profile_id','expires_at','data_access_expires_at')}
              out['scopes']=debug.get('scopes',[])
              me=get('me',{'fields':'id,name'})
              out['me']=me
              if 'id' in me:
                  out['me_ig_link']=get('me',{'fields':'instagram_business_account'}).get('instagram_business_account')
              accounts=get('me/accounts',{'fields':'id,name'})
              out['accounts']=[{'id':a.get('id'),'name':a.get('name')} for a in accounts.get('data',[])] if isinstance(accounts,dict) and 'data' in accounts else accounts
          out['configured_page_id']=os.environ.get('FB_PAGE_ID','')
          print(json.dumps(out,ensure_ascii=False,indent=2))
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as s:s.write('```json\n'+json.dumps(out,ensure_ascii=False,indent=2)+'\n```\n')
          PY
