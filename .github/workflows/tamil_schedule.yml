name: Tamil scheduled ready-asset publishing
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Dispatch purpose - manual asset or current scheduled slot
        type: choice
        required: true
        default: manual
        options:
          - manual
          - scheduled
permissions:
  contents: write
concurrency:
  group: tamil-ready-asset-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Validate publication gates
        run: python -m unittest discover -s tests -v
      - name: Prepare durable publication state branch
        shell: bash
        run: |
          git config user.name 'Tamil GK automation'
          git config user.email 'actions@users.noreply.github.com'
          if git ls-remote --exit-code --heads origin tamil-publication-state >/dev/null; then
            git fetch origin tamil-publication-state
            git worktree add /tmp/tamil-state FETCH_HEAD
          else
            git worktree add --detach /tmp/tamil-state HEAD
            cd /tmp/tamil-state
            git checkout --orphan tamil-publication-state
            git rm -rf .
            printf '%s\n' '{"slots":{},"published_ids":[],"checks":[]}' > state.json
            git add state.json
            git commit -m 'Initialize Tamil durable publication state'
            git push origin HEAD:tamil-publication-state
          fi
      - name: Check slot, measure drift and publish only exact approved assets
        env:
          PUBLICATION_STATE_DIR: /tmp/tamil-state
          DISPATCH_MODE: ${{ inputs.mode }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python scripts/scheduled_publish.py
      - name: Verify recorded YouTube receipt and public metadata
        env:
          PUBLICATION_STATE_DIR: /tmp/tamil-state
          YT_CHANNEL_ID: UC5ZLfNHUI4z92IW69KVTGxg
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: |
          python - <<'PYVERIFY'
          import json,os,sys
          sys.path.insert(0,'scripts')
          from upload_youtube import get_youtube_client
          state=json.load(open(os.environ['PUBLICATION_STATE_DIR']+'/state.json'))
          ids=[v['youtube_id'] for v in state.get('slots',{}).values() if v.get('status')=='published']
          if ids:
              y=get_youtube_client()
              items=y.videos().list(part='snippet,status',id=','.join(ids)).execute().get('items',[])
              for v in items:
                  assert v['snippet']['channelId']==os.environ['YT_CHANNEL_ID']
                  assert v['status']['privacyStatus']=='public'
                  print(json.dumps({'url':'https://www.youtube.com/watch?v='+v['id'],'title':v['snippet']['title'],'status':v['status']},ensure_ascii=False))
          PYVERIFY
      - name: Write timing and receipt summary without artifact storage
        if: always()
        shell: bash
        run: |
          python - <<'PYSUMMARY'
          import os
          from pathlib import Path
          state=Path('/tmp/tamil-state/state.json')
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as summary:
              summary.write('## Tamil publication state\n')
              if state.is_file():
                  summary.write('```json\n'+state.read_text()+'\n```\n')
              else:
                  summary.write('State unavailable: an earlier gate or state setup failed. Inspect the failed step.\n')
          PYSUMMARY
# Native cron removed while Tamil setup is parked.
# One external scheduler will dispatch approved 07:30/19:30 IST slots after activation.
